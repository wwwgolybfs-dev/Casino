<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Petzker Bet — Рулетка</title>
<style>
:root{
  --bg:#080a0e;--surface:#11151b;--surface2:#171c23;--border:rgba(255,255,255,.09);
  --text:#f5f7fb;--muted:#8b94a4;--green:#18c985;--green2:#0d8158;
  --red:#c9364c;--black:#181c22;--gold:#e8bb62;--shadow:0 10px 28px rgba(0,0,0,.38)
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit}
.app{width:min(100%,720px);margin:auto;padding:7px 9px 14px}
.topbar{height:43px;display:flex;align-items:center;gap:8px}
.back{width:35px;height:35px;border:1px solid var(--border);border-radius:11px;background:var(--surface);display:grid;place-items:center;font-size:19px}
.title{font-size:15px;font-weight:900}.balance{margin-left:auto;font-size:11px;font-weight:800;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 9px}.balance span{color:var(--gold)}
.historybar{display:flex;align-items:center;gap:7px;height:37px;padding:5px 8px;border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.history-label{font-size:9px;color:var(--muted);font-weight:900;white-space:nowrap;text-transform:uppercase}
.history{display:flex;gap:5px;overflow:hidden}
.ball{width:25px;height:25px;flex:0 0 25px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:900;border:1px solid rgba(255,255,255,.12)}
.ball.red{background:var(--red)}.ball.black{background:#20242b}.ball.green{background:var(--green2)}

.roulette-area{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:center;margin-top:9px}
.wheel-box{position:relative;display:grid;place-items:center}
.wheel{width:178px;height:178px;border-radius:50%;position:relative;border:7px solid #252b32;
background:conic-gradient(
#171a1f 0 4.87%,#b93145 4.87% 9.74%,#171a1f 9.74% 14.61%,#b93145 14.61% 19.48%,#171a1f 19.48% 24.35%,#b93145 24.35% 29.22%,#171a1f 29.22% 34.09%,#b93145 34.09% 38.96%,#171a1f 38.96% 43.83%,#b93145 43.83% 48.70%,#171a1f 48.70% 53.57%,#b93145 53.57% 58.44%,#171a1f 58.44% 63.31%,#b93145 63.31% 68.18%,#171a1f 68.18% 73.05%,#b93145 73.05% 77.92%,#171a1f 77.92% 82.79%,#b93145 82.79% 87.66%,#171a1f 87.66% 92.53%,#b93145 92.53% 97.40%,#171a1f 97.40% 100%);
box-shadow:0 0 0 2px #080a0e,0 9px 24px rgba(0,0,0,.5);transition:transform 3.7s cubic-bezier(.12,.72,.13,1);will-change:transform}
.wheel:before{content:"";position:absolute;inset:20%;border-radius:50%;background:radial-gradient(circle,#343b45 0 7%,#11151b 8% 45%,#080a0e 46% 100%);border:2px solid rgba(255,255,255,.13)}
.wheel-numbers{position:absolute;inset:4px;border-radius:50%;z-index:2;pointer-events:none}
.wheel-number{position:absolute;left:50%;top:50%;width:19px;height:19px;margin:-9.5px;font-size:7px;font-weight:1000;text-align:center;line-height:19px;text-shadow:0 1px 3px #000;transform:rotate(var(--a)) translateY(-70px) rotate(calc(var(--a) * -1))}
.wheel-number.red{color:#ffb0ba}.wheel-number.black{color:#fff}.wheel-number.green{color:#9ff3cc}
.pointer{position:absolute;z-index:5;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:14px solid var(--gold);filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.wheel-center{position:absolute;z-index:4;inset:0;display:grid;place-items:center;font-size:14px;font-weight:1000;text-shadow:0 2px 6px #000}

.bets{min-width:0}
.section-title{font-size:9px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin:0 0 5px}
.zero{width:100%;height:34px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:linear-gradient(135deg,#159a68,#0b704d);font-size:12px;font-weight:1000}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:3px}
.num{height:30px;border:1px solid rgba(255,255,255,.08);border-radius:6px;font-size:10px;font-weight:900;cursor:pointer}
.num.red{background:#8e293c}.num.black{background:#1c2026}.num.green{background:#0d8158}
.num.selected,.bet-option.selected{outline:1px solid var(--gold);outline-offset:-1px;box-shadow:inset 0 0 0 1px rgba(232,187,98,.35)}
.outside{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:4px}
.bet-option{height:29px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);font-size:9px;font-weight:800}
.bet-option.red{background:#61202d}.bet-option.black{background:#1a1d23}

.controls{margin-top:8px;display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center}
.chips{display:flex;gap:5px;overflow:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{width:36px;height:30px;flex:0 0 36px;border:1px dashed rgba(255,255,255,.4);border-radius:50%;background:#20252d;font-size:9px;font-weight:1000}
.chip.active{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 2px rgba(232,187,98,.10)}
.betamount{font-size:10px;font-weight:800;white-space:nowrap;padding:8px 9px;border:1px solid var(--border);background:var(--surface);border-radius:9px}
.actions{display:flex;gap:5px}
.clear,.spin{height:34px;border-radius:9px;padding:0 11px;font-size:10px;font-weight:1000}
.clear{border:1px solid var(--border);background:var(--surface)}.spin{border:0;background:linear-gradient(135deg,var(--green),var(--green2));box-shadow:0 6px 14px rgba(24,201,133,.15)}
.spin:disabled{opacity:.45}
.message{height:18px;margin-top:4px;text-align:center;color:var(--muted);font-size:9px;font-weight:700}
.rules{font-size:8px;color:#667080;text-align:center}

@media(max-width:520px){
  .roulette-area{grid-template-columns:150px 1fr;gap:7px}
  .wheel{width:145px;height:145px;border-width:6px}
  .wheel-number{width:16px;height:16px;margin:-8px;line-height:16px;font-size:6px;transform:rotate(var(--a)) translateY(-56px) rotate(calc(var(--a) * -1))}
  .wheel-center{font-size:12px}
  .pointer{top:-3px}
  .controls{grid-template-columns:1fr auto}
  .betamount{grid-column:1/-1;text-align:center;padding:5px}
}
@media(max-width:360px){
  .roulette-area{grid-template-columns:132px 1fr}
  .wheel{width:128px;height:128px}
  .wheel-number{transform:rotate(var(--a)) translateY(-49px) rotate(calc(var(--a) * -1))}
  .num{height:27px}.bet-option{height:27px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<button class="back" onclick="goBack()">←</button>
<div class="title">Рулетка</div>
<div class="balance">Баланс: <span id="balance">1 000</span> ₽</div>
</header>

<div class="historybar">
<div class="history-label">История</div>
<div class="history" id="history"></div>
</div>

<section class="roulette-area">
<div class="wheel-box">
<div class="pointer"></div>
<div class="wheel" id="wheel">
<div class="wheel-numbers" id="wheelNumbers"></div>
<div class="wheel-center" id="wheelCenter">0</div>
</div>
</div>

<div class="bets">
<div class="section-title">Выберите ставку</div>
<button class="zero num green" data-number="0">0</button>
<div class="grid" id="numberGrid"></div>
<div class="outside">
<button class="bet-option red" data-bet="red">Красное</button>
<button class="bet-option black" data-bet="black">Чёрное</button>
<button class="bet-option" data-bet="odd">Нечёт</button>
<button class="bet-option" data-bet="even">Чёт</button>
<button class="bet-option" data-bet="low">1–18</button>
<button class="bet-option" data-bet="high">19–36</button>
</div>
</div>
</section>

<div class="controls">
<div class="chips" id="chips"></div>
<div class="betamount">Ставка: <span id="betAmount">100</span> ₽</div>
<div class="actions"><button class="clear" id="clearBtn">Сброс</button><button class="spin" id="spinBtn">Крутить</button></div>
</div>
<div class="message" id="message">Выберите ставку</div>
<div class="rules">Демо-режим · Европейская рулетка · 0–36</div>
</div>

<script>
const wheelOrder=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const redNumbers=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const colorOf=n=>n===0?'green':redNumbers.has(n)?'red':'black';

let balance=1000,betAmount=100,selectedBet=null,spinning=false,rotation=0;
let history=[17,32,0,8,21,14];

const $=id=>document.getElementById(id);

function renderWheelNumbers(){
  $('wheelNumbers').innerHTML=wheelOrder.map((n,i)=>{
    const a=(i*360/wheelOrder.length)-90;
    return `<span class="wheel-number ${colorOf(n)}" style="--a:${a}deg">${n}</span>`;
  }).join('');
}
function renderNumbers(){
  $('numberGrid').innerHTML=Array.from({length:36},(_,i)=>i+1).map(n=>
    `<button class="num ${colorOf(n)}" data-number="${n}">${n}</button>`
  ).join('');
}
function renderHistory(){
  $('history').innerHTML=history.slice(0,9).map(n=>`<span class="ball ${colorOf(n)}">${n}</span>`).join('');
}
function renderChips(){
  $('chips').innerHTML=[10,25,50,100,250,500].map(v=>
    `<button class="chip ${v===betAmount?'active':''}" data-chip="${v}">${v}</button>`
  ).join('');
}
function render(){
  renderWheelNumbers();renderNumbers();renderHistory();renderChips();
  $('balance').textContent=balance.toLocaleString('ru-RU');
  $('betAmount').textContent=betAmount.toLocaleString('ru-RU');
}
function label(t){return {red:'красное',black:'чёрное',odd:'нечёт',even:'чёт',low:'1–18',high:'19–36'}[t]}
function selectBet(type,value=null){
  selectedBet={type,value};
  document.querySelectorAll('.num,.bet-option').forEach(x=>x.classList.remove('selected'));
  const el=type==='number'?document.querySelector(`[data-number="${value}"]`):document.querySelector(`[data-bet="${type}"]`);
  el?.classList.add('selected');
  $('message').textContent=type==='number'?`Ставка на ${value}`:`Ставка: ${label(type)}`;
}
function isWin(n){
  if(!selectedBet)return false;
  if(selectedBet.type==='number')return n===selectedBet.value;
  if(n===0)return false;
  if(selectedBet.type==='red')return redNumbers.has(n);
  if(selectedBet.type==='black')return !redNumbers.has(n);
  if(selectedBet.type==='odd')return n%2===1;
  if(selectedBet.type==='even')return n%2===0;
  if(selectedBet.type==='low')return n<=18;
  if(selectedBet.type==='high')return n>=19;
  return false;
}
function payout(){return selectedBet?.type==='number'?36:2}
function spin(){
  if(spinning)return;
  if(!selectedBet){$('message').textContent='Сначала выберите ставку';return}
  if(balance<betAmount){$('message').textContent='Недостаточно средств';return}
  spinning=true;$('spinBtn').disabled=true;
  balance-=betAmount;$('balance').textContent=balance.toLocaleString('ru-RU');
  const result=wheelOrder[Math.floor(Math.random()*wheelOrder.length)];
  const index=wheelOrder.indexOf(result);
  const sector=360/wheelOrder.length;
  const target=(index*sector)+sector/2;
  const extra=5+Math.floor(Math.random()*2);
  rotation+=extra*360+(360-target);
  $('wheel').style.transform=`rotate(${rotation}deg)`;
  $('wheelCenter').textContent='•';
  $('message').textContent='Рулетка вращается…';
  setTimeout(()=>{
    const win=isWin(result);
    if(win){
      const prize=betAmount*payout();
      balance+=prize;
      $('message').textContent=`Выпало ${result} · +${prize.toLocaleString('ru-RU')} ₽`;
    }else $('message').textContent=`Выпало ${result} · ставка проиграла`;
    $('wheelCenter').textContent=result;
    history.unshift(result);history=history.slice(0,10);renderHistory();
    $('balance').textContent=balance.toLocaleString('ru-RU');
    selectedBet=null;document.querySelectorAll('.num,.bet-option').forEach(x=>x.classList.remove('selected'));
    spinning=false;$('spinBtn').disabled=false;
  },3800);
}
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-number]'),b=e.target.closest('[data-bet]'),c=e.target.closest('[data-chip]');
  if(n)selectBet('number',Number(n.dataset.number));
  if(b)selectBet(b.dataset.bet);
  if(c){betAmount=Number(c.dataset.chip);renderChips();$('betAmount').textContent=betAmount.toLocaleString('ru-RU')}
});
$('spinBtn').onclick=spin;
$('clearBtn').onclick=()=>{selectedBet=null;document.querySelectorAll('.num,.bet-option').forEach(x=>x.classList.remove('selected'));$('message').textContent='Выберите ставку'};
function goBack(){if(document.referrer)history.back();else location.href='casino.html'}
render();
</script>
</body>
</html>
