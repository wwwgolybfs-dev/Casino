<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080c">
<title>Petzker Bet — Poker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#07080c;--panel:#0e1118;--panel2:#131820;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --text:#f4f6fb;--muted:#7a8496;
  --gold:#e8c872;--gold2:#b8923a;--gold-glow:rgba(232,200,114,.18);
  --green:#12b88a;--red:#c43b4e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:"SF Pro Display",Inter,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;background:
  radial-gradient(ellipse 120% 80% at 50% -20%,rgba(232,200,114,.06),transparent 50%),
  radial-gradient(ellipse 80% 50% at 20% 100%,rgba(18,184,138,.04),transparent 40%),
  var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.app{width:min(100%,400px);padding:20px 16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.back{width:40px;height:40px;border:1px solid var(--line);background:var(--panel);border-radius:12px;display:grid;place-items:center;font-size:18px}
.title{font-size:18px;font-weight:800}.title span{color:var(--gold)}
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:22px;font-weight:900;margin-bottom:6px}
.hero p{color:var(--muted);font-size:13px;line-height:1.45}
.modes{display:flex;flex-direction:column;gap:12px}
.mode{
  display:flex;align-items:center;gap:14px;padding:16px;
  border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(135deg,var(--panel),var(--panel2));
  transition:transform .12s,border-color .15s,box-shadow .15s;
  text-align:left
}
.mode:active{transform:scale(.98)}
.mode:hover{border-color:rgba(232,200,114,.35);box-shadow:0 0 0 1px var(--gold-glow)}
.mode-icon{
  width:52px;height:52px;border-radius:14px;display:grid;place-items:center;
  font-size:24px;flex-shrink:0
}
.mode.offline .mode-icon{background:linear-gradient(145deg,#1a4a3a,#0a2a20);border:1px solid rgba(18,184,138,.3)}
.mode.online .mode-icon{background:linear-gradient(145deg,#1a3a5a,#0a1a30);border:1px solid rgba(42,111,214,.35)}
.mode-body{flex:1}
.mode-body h3{font-size:15px;font-weight:800;margin-bottom:3px}
.mode-body p{font-size:11px;color:var(--muted);line-height:1.35}
.mode-arrow{color:var(--muted);font-size:18px}
.note{text-align:center;color:#4a5363;font-size:10px;margin-top:22px;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="back" id="backBtn">←</button>
    <div class="title">Petzker <span>Poker</span></div>
  </header>

  <div class="hero">
    <h1>♠ Ебучий покер ♥</h1>
    <p>Выберите режим игры</p>
  </div>

  <div class="modes">
    <button class="mode offline" id="btnOffline">
      <div class="mode-icon">🤖</div>
      <div class="mode-body">
        <h3>Оффлайн</h3>
        <p>Один игрок против диллера.</p>
      </div>
      <div class="mode-arrow">→</div>
    </button>

    <button class="mode online" id="btnOnline">
      <div class="mode-icon">🌐</div>
      <div class="mode-body">
        <h3>Онлайн</h3>
        <p>2–3 игрока. </p>
      </div>
      <div class="mode-arrow">→</div>
    </button>
  </div>

  <div class="note">Полные правила Texas Hold'em</div>
</div>
<script>
try{const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}}catch(e){}
const q=location.search||'';
document.getElementById('btnOffline').onclick=()=>location.href='poker_offline.html'+q;
document.getElementById('btnOnline').onclick=()=>location.href='poker_online.html'+q;
document.getElementById('backBtn').onclick=()=>{
  if(history.length>1)history.back();else location.href='casino.html';
};
</script>
</body>
</html>
